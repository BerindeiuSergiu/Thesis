<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="780" viewBox="0 0 1300 780">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .folder { fill: #fef3c7; stroke: #b45309; stroke-width: 2; rx: 10; }
      .file { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 8; }
      .branch { fill: #f3e8ff; stroke: #7e22ce; stroke-width: 2; rx: 10; }
      .title { font: 700 28px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 16px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 13px Segoe UI, Arial, sans-serif; fill: #334155; }
      .line { stroke: #334155; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1300" height="780"/>
  <text class="title" x="48" y="52">FIGURA 5.3 - Structura outputului pentru o scena reconstruita</text>
  <text class="small" x="48" y="78">Artefacte produse de pipeline: date brute, rapoarte JSON, nor de puncte, Gaussian si mesh optional.</text>

  <rect class="folder" x="70" y="120" width="290" height="70"/>
  <text class="label" x="95" y="154">src/outputs/scene_*</text>
  <text class="small" x="95" y="176">directorul unei rulari</text>

  <path class="line" d="M 215 190 L 215 705"/>
  <path class="line" d="M 215 245 L 380 245"/>
  <path class="line" d="M 215 330 L 380 330"/>
  <path class="line" d="M 215 415 L 380 415"/>
  <path class="line" d="M 215 500 L 380 500"/>
  <path class="line" d="M 215 585 L 380 585"/>
  <path class="line" d="M 215 670 L 380 670"/>

  <rect class="file" x="380" y="215" width="320" height="60"/>
  <text class="label" x="405" y="246">scene_metadata.json</text>
  <text class="small" x="405" y="266">setari, warnings, output manifest</text>

  <rect class="file" x="380" y="300" width="320" height="60"/>
  <text class="label" x="405" y="331">fast3r_point_retention_report.json</text>
  <text class="small" x="405" y="351">puncte prezise, filtrate, retinute</text>

  <rect class="file" x="380" y="385" width="320" height="60"/>
  <text class="label" x="405" y="416">scale_normalization_report.json</text>
  <text class="small" x="405" y="436">factor de scala si referinta metrica</text>

  <rect class="file" x="380" y="470" width="320" height="60"/>
  <text class="label" x="405" y="501">pointcloud_processing_report.json</text>
  <text class="small" x="405" y="521">filtrare, voxel, puncte finale</text>

  <rect class="file" x="380" y="555" width="320" height="60"/>
  <text class="label" x="405" y="586">pointcloud.ply + arrays .npy</text>
  <text class="small" x="405" y="606">geometria procesata comuna</text>

  <rect class="branch" x="380" y="640" width="320" height="60"/>
  <text class="label" x="405" y="671">frames/</text>
  <text class="small" x="405" y="691">cadrele selectate salvate</text>

  <rect class="branch" x="780" y="235" width="400" height="170"/>
  <text class="label" x="815" y="270">gaussian_splat/</text>
  <text class="small" x="815" y="302">gaussian_splats_init.ply</text>
  <text class="small" x="815" y="326">gaussian_params.npz</text>
  <text class="small" x="815" y="350">scaled_points_for_gaussian.ply</text>
  <text class="small" x="815" y="374">gaussian_splat_report.json</text>

  <rect class="branch" x="780" y="455" width="400" height="170"/>
  <text class="label" x="815" y="490">mesh/ optional</text>
  <text class="small" x="815" y="522">mesh_scaled_poisson.ply</text>
  <text class="small" x="815" y="546">mesh_scaled_poisson.obj</text>
  <text class="small" x="815" y="570">mesh_branch_report.json</text>
  <text class="small" x="815" y="594">Poisson, cleanup, decimation</text>

  <path class="line" d="M 700 585 C 750 585, 750 320, 780 320"/>
  <path class="line" d="M 700 585 C 750 585, 750 540, 780 540"/>
  <text class="small" x="780" y="675">Ambele ramuri pornesc din aceeasi geometrie procesata, evitand reconstructia duplicata.</text>
</svg>
