<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .layer { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 14; }
      .box { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 10; }
      .box2 { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 10; }
      .box3 { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 10; }
      .box4 { fill: #f3e8ff; stroke: #7e22ce; stroke-width: 2; rx: 10; }
      .title { font: 700 28px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .layerTitle { font: 700 20px Segoe UI, Arial, sans-serif; fill: #1e293b; }
      .text { font: 600 16px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 13px Segoe UI, Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1400" height="860"/>
  <text class="title" x="48" y="52">FIGURA 5.1 - Arhitectura aplicatiei desktop</text>
  <text class="small" x="48" y="78">Diagrama UML/componenta pentru aplicatia Fast3R: UI, servicii, pipeline, infrastructura si artefacte.</text>

  <rect class="layer" x="50" y="110" width="300" height="650"/>
  <text class="layerTitle" x="75" y="145">Presentation / PyQt6</text>
  <rect class="box" x="75" y="175" width="250" height="72"/>
  <text class="text" x="98" y="205">MainWindow</text>
  <text class="small" x="98" y="228">workflow menu, docks, status</text>
  <rect class="box" x="75" y="270" width="250" height="72"/>
  <text class="text" x="98" y="300">SceneListWidget</text>
  <text class="small" x="98" y="323">scene history browser</text>
  <rect class="box" x="75" y="365" width="250" height="72"/>
  <text class="text" x="98" y="395">Reconstruction Panel</text>
  <text class="small" x="98" y="418">input, weights, preset, actions</text>
  <rect class="box" x="75" y="460" width="250" height="72"/>
  <text class="text" x="98" y="490">StageProgressWidget</text>
  <text class="small" x="98" y="513">pipeline progress tracker</text>
  <rect class="box" x="75" y="555" width="250" height="72"/>
  <text class="text" x="98" y="585">EmbeddedViewerWidget</text>
  <text class="small" x="98" y="608">QWebEngineView + Viser URL</text>
  <rect class="box" x="75" y="650" width="250" height="72"/>
  <text class="text" x="98" y="680">PipelineWorker</text>
  <text class="small" x="98" y="703">QThread background run</text>

  <rect class="layer" x="390" y="110" width="300" height="650"/>
  <text class="layerTitle" x="415" y="145">Application Services</text>
  <rect class="box2" x="415" y="190" width="250" height="84"/>
  <text class="text" x="438" y="223">SceneRepository</text>
  <text class="small" x="438" y="246">src/data/scenes_index.json</text>
  <rect class="box2" x="415" y="315" width="250" height="84"/>
  <text class="text" x="438" y="348">ViewerService</text>
  <text class="small" x="438" y="371">viewer policy + launch result</text>
  <rect class="box2" x="415" y="440" width="250" height="84"/>
  <text class="text" x="438" y="473">Scene / SceneResult</text>
  <text class="small" x="438" y="496">domain records + metadata</text>
  <rect class="box2" x="415" y="565" width="250" height="84"/>
  <text class="text" x="438" y="598">Runtime Config</text>
  <text class="small" x="438" y="621">settings.yaml + UI overrides</text>

  <rect class="layer" x="730" y="110" width="300" height="650"/>
  <text class="layerTitle" x="755" y="145">Pipeline Layer</text>
  <rect class="box3" x="755" y="175" width="250" height="72"/>
  <text class="text" x="778" y="205">PipelineFactory</text>
  <text class="small" x="778" y="228">registered default pipeline</text>
  <rect class="box3" x="755" y="270" width="250" height="72"/>
  <text class="text" x="778" y="300">Fast3rPipeline</text>
  <text class="small" x="778" y="323">end-to-end orchestration</text>
  <rect class="box3" x="755" y="365" width="250" height="72"/>
  <text class="text" x="778" y="395">Frame Selection</text>
  <text class="small" x="778" y="418">visual + geometry-aware probe</text>
  <rect class="box3" x="755" y="460" width="250" height="72"/>
  <text class="text" x="778" y="490">Fast3R Reconstructor</text>
  <text class="small" x="778" y="513">from_pretrained profile</text>
  <rect class="box3" x="755" y="555" width="250" height="72"/>
  <text class="text" x="778" y="585">Postprocess + Scale</text>
  <text class="small" x="778" y="608">filtering, meters, cleanup</text>
  <rect class="box3" x="755" y="650" width="250" height="72"/>
  <text class="text" x="778" y="680">Gaussian / Mesh Branches</text>
  <text class="small" x="778" y="703">dual outputs from one geometry</text>

  <rect class="layer" x="1070" y="110" width="280" height="650"/>
  <text class="layerTitle" x="1095" y="145">Infrastructure / Files</text>
  <rect class="box4" x="1095" y="190" width="230" height="72"/>
  <text class="text" x="1118" y="220">Fast3R + PyTorch</text>
  <text class="small" x="1118" y="243">default or fine-tuned weights</text>
  <rect class="box4" x="1095" y="300" width="230" height="72"/>
  <text class="text" x="1118" y="330">OpenCV / Open3D</text>
  <text class="small" x="1118" y="353">frames + geometry backend</text>
  <rect class="box4" x="1095" y="410" width="230" height="72"/>
  <text class="text" x="1118" y="440">Scene Outputs</text>
  <text class="small" x="1118" y="463">metadata, PLY, NPZ, OBJ</text>
  <rect class="box4" x="1095" y="520" width="230" height="72"/>
  <text class="text" x="1118" y="550">Viser Server</text>
  <text class="small" x="1118" y="573">local URL embedded in app</text>
  <rect class="box4" x="1095" y="630" width="230" height="72"/>
  <text class="text" x="1118" y="660">Logs / JSON Reports</text>
  <text class="small" x="1118" y="683">reproducible evidence</text>

  <path class="arrow" d="M 325 210 C 360 210, 380 230, 415 230"/>
  <path class="arrow" d="M 325 685 C 495 685, 585 685, 755 305"/>
  <path class="arrow" d="M 665 355 C 700 355, 720 305, 755 305"/>
  <path class="arrow" d="M 1005 495 C 1040 495, 1060 335, 1095 335"/>
  <path class="arrow" d="M 1005 685 C 1040 685, 1060 450, 1095 450"/>
  <path class="arrow" d="M 1325 555 C 1370 555, 1370 590, 325 590"/>
  <path class="arrow" d="M 665 230 C 715 230, 715 210, 755 210"/>
</svg>
